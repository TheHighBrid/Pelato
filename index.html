<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Pelato. Your offline music collection, beautifully organized.">
  <title>PELATO / MUSIC</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Navigation">
      <a class="brand" href="#home" data-view="home"><span class="mark">P</span><span>PELATO<small>BY MELATO</small></span></a>
      <nav class="nav" aria-label="Library navigation">
        <button data-view="home" class="active"><span>⌂</span> Home</button>
        <button data-view="search"><span>⌕</span> Search</button>
        <button data-view="library"><span>▥</span> Your Library</button>
        <button data-view="liked"><span>♡</span> Liked Songs</button>
      </nav>
      <div class="playlist-heading"><span>YOUR PLAYLISTS</span><button id="newPlaylist" aria-label="Create playlist">+</button></div>
      <div id="playlists" class="nav playlists"></div>
      <div class="sidebar-bottom"><button data-view="settings"><span>⚙</span> Settings</button><p><i></i> LOCAL FIRST · V0.1</p></div>
    </aside>
    <main>
      <header class="top"><span class="eyebrow" id="location">YOUR SOUND / YOUR SPACE</span><button id="import" class="button primary">＋ Import music</button></header>
      <input id="files" type="file" multiple accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg,.opus,.aac,.aiff" hidden>
      <input id="folder" type="file" multiple webkitdirectory hidden>
      <div id="status" role="status" aria-live="polite"></div>
      <section id="content" aria-label="Current view"></section>
    </main>
    <aside class="queue" id="queuePanel" hidden><div class="queue-head"><h2>Up next</h2><button id="closeQueue" aria-label="Close queue">×</button></div><div id="queueContent"></div></aside>
  </div>
  <footer class="player" aria-label="Playback controls">
    <div class="now"><div class="cover miniature" id="nowCover">♫</div><div class="now-info"><strong id="nowTitle">Nothing playing</strong><small id="nowArtist">Your music awaits</small></div><button id="heart" aria-label="Like current track" disabled>♡</button></div>
    <div class="transport"><div class="controls"><button id="shuffle" aria-label="Shuffle" aria-pressed="false">⤨</button><button id="prev" aria-label="Previous">⏮</button><button id="play" class="play" aria-label="Play">▶</button><button id="next" aria-label="Next">⏭</button><button id="repeat" aria-label="Repeat off" aria-pressed="false">↻</button></div><div class="timeline"><small id="elapsed">0:00</small><input id="seek" aria-label="Seek" type="range" min="0" max="1000" value="0"><small id="duration">0:00</small></div></div>
    <div class="extras"><button id="queueToggle" aria-label="Show queue" aria-expanded="false">☰</button><span aria-hidden="true">◖</span><input id="volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="0.8"></div>
  </footer>
  <audio id="audio" preload="metadata"></audio>
  <dialog id="modal"><form method="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="dialog-actions"><button value="cancel" class="button" formnovalidate>Cancel</button><button value="ok" class="button primary">Save</button></div></form></dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
